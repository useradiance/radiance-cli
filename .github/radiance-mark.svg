<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Radiance">
  <!-- Same motif as the hero mark: a core, concentric rings, and rays.
       Drawn at 64px and kept deliberately sparse — at 16px in a tab strip the
       thin outer rings disappear and the core plus the heavy ring carry it.

       Transparent, with no plate behind it. Teal is the one brand colour that
       holds up on both a light and a dark tab strip, so the mark can sit
       directly on whatever the browser puts behind it. Opacities are lifted
       from the plated version, which could lean on a dark backdrop for
       contrast and no longer can. -->

  <g fill="none" stroke="#0f9e8c" stroke-linecap="round">
    <circle cx="32" cy="32" r="21" stroke-width="1.5" opacity="0.45"/>
    <circle cx="32" cy="32" r="15" stroke-width="1.75" opacity="0.7"/>
    <circle cx="32" cy="32" r="9"  stroke-width="2.5"/>
  </g>

  <g stroke="#0f9e8c" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="32" y1="3"  x2="32" y2="9"/>
    <line x1="32" y1="55" x2="32" y2="61"/>
    <line x1="3"  y1="32" x2="9"  y2="32"/>
    <line x1="55" y1="32" x2="61" y2="32"/>
  </g>
  <g stroke="#0f9e8c" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <line x1="11.5" y1="11.5" x2="15.5" y2="15.5"/>
    <line x1="48.5" y1="48.5" x2="52.5" y2="52.5"/>
    <line x1="52.5" y1="11.5" x2="48.5" y2="15.5"/>
    <line x1="15.5" y1="48.5" x2="11.5" y2="52.5"/>
  </g>

  <circle cx="32" cy="32" r="4.5" fill="#0f9e8c"/>
</svg>
